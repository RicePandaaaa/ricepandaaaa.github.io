<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anthony Ha-Anh Pham</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
</head>
<body class="console-background">
    <!-- Text Section -->
    <div class="typewriter-container">
      <p id="line1" class="typewriter text-3xl"></p>
      <p id="line2" class="typewriter text-3xl"></p>
    </div>
  
    <!-- Grid Section -->
    <div class="bars-container grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-4 gap-4 w-full mx-auto">
        <div id="coder-bar" class="persona-bar">
            <img src="assets/home_page/computer_no_hover.png" alt="Coder Icon" class="persona-image">
            <p class="text-3xl mt-6">Coder!</p>
        </div>
        <div id="student-bar" class="persona-bar">
            <img src="assets/home_page/computer_no_hover.png" alt="Student Icon" class="persona-image">
            <p class="text-3xl mt-6">Student!</p>
        </div>
        <div id="hobbyist-bar" class="persona-bar">
            <img src="assets/home_page/computer_no_hover.png" alt="Hobbyist Icon" class="persona-image">
            <p class="text-3xl mt-6">Hobbyist!</p>
        </div>
        <div id="teacher-bar" class="persona-bar">
            <img src="assets/home_page/computer_no_hover.png" alt="Teacher Icon" class="persona-image">
            <p class="text-3xl mt-6">Teacher!</p>
        </div>          
    </div>

    <footer class="text-white py-4 mt- w-full">
        <div class="container mx-auto text-center">
            <p class="text-sm">
                © 2024 Anthony Ha-Anh Pham. All rights reserved.
            </p>
            <p class="text-sm">
                Website source code available on 
                <a href="https://github.com/RicePandaaaa/ricepandaaaa.github.io" target="_blank" rel="noopener noreferrer">
                    GitHub
                </a>
            </p>
        </div>
    </footer>
  </body>  
</html>
