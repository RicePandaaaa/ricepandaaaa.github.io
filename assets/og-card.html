<!doctype html>
<html><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<!-- Source for assets/og-card.jpg (link-preview image). Regenerate: see CLAUDE.md "Share card". -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=block" rel="stylesheet">
<style>
  /* 1200x630 link-preview card. Navy (not black) with a soft lift toward the center:
     dark enough not to "flashbang" dark-mode feeds, no hard bright edge on light feeds. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 70% 80% at 50% 45%, #1f2a3b 0%, #161e2b 70%);
    color: #fff; font-family: Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  img { width: 196px; height: 196px; border-radius: 50%; border: 6px solid #fff; object-fit: cover; }
  h1 { font-size: 58px; font-weight: 700; letter-spacing: -0.02em; margin: 30px 0 10px; line-height: 1.1; }
  h1 span { color: #77BBD5; }
  .tag { font-size: 30px; color: #d1d5db; margin: 0 0 8px; }
  .meta { font-size: 23px; color: #9ca3af; margin: 0; }
  .url { font-size: 22px; color: #9ca3af; margin: 34px 0 0; letter-spacing: 0.01em; }
</style></head>
<body>
  <img src="headshot.webp" alt="">
  <h1><span>Anthony</span> Ha-Anh Pham</h1>
  <p class="tag">Graduate Student, Engineer, and Teacher</p>
  <p class="meta">M.S. Engineering Technology · Texas A&amp;M University</p>
  <p class="url">anthonyhpham.me</p>
</body></html>
